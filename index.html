        { word:'pin', phonemes:['p','i','n'], emoji:'📍' },
        { word:'bed', phonemes:['b','e','d'], emoji:'🛏️' },
        { word:'gym', phonemes:['g','y','m'], emoji:'🤸' }
      ]},
      { name:'Words with blends', story:'The frog can swim. A flag is on the rock.', words:[
        { word:'frog', phonemes:['f','r','o','g'], emoji:'🐸' },
        { word:'swim', phonemes:['s','w','i','m'], emoji:'🏊' },
        { word:'flag', phonemes:['f','l','a','g'], emoji:'🚩' }
      ]},
      { name:'Words with letter teams', story:'The ship is big. The thin fish can chat.', words:[
        { word:'ship', phonemes:['sh','i','p'], emoji:'🚢' },
        { word:'thin', phonemes:['th','i','n'], emoji:'🪶' },
        { word:'chat', phonemes:['ch','a','t'], emoji:'💬' }
      ]}
    ];
    const main = document.querySelector('#main');
    const soundToggle = document.querySelector('#soundToggle');
    const marinAudio = JSON.parse(document.querySelector('#marin-audio-manifest').textContent);
    const audioPlayer = new Audio();
    const MARIN_FALLBACK_TIMEOUT = 10000;
    let soundOn = true, levelIndex = 0, wordIndex = 0, vowelIndex = 0, phase = 'home', letters = [], locked = false, englishVoice = null, savedAvailable = false, celebrationKey = null;
    let speechAttempt = 0, marinFallbackTimer = null;
    const SAVE_KEY = 'word-garden-progress-v1';
    let currentDirections = 'Welcome to Word Garden! Ask a grown-up to press Let’s play to start your reading adventure.';
    const level = () => levels[levelIndex];
    const item = () => level().words[wordIndex];
    function saveProgress() {
      if (phase === 'home') return;
      try { localStorage.setItem(SAVE_KEY, JSON.stringify({levelIndex,wordIndex,vowelIndex,phase,letters,celebrationKey})); savedAvailable=true; }
      catch (_) { /* Keep the game playable if browser storage is unavailable. */ }
    }
    function restoreProgress() {
      try {
        const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
        if(!saved||!['vowel','sound','build','story','celebrate','complete'].includes(saved.phase))return false;
        if(!Number.isInteger(saved.levelIndex)||saved.levelIndex<0||saved.levelIndex>=levels.length)return false;
        const wordCount=levels[saved.levelIndex].words.length;
        const mayBeAtEnd=['story','celebrate','complete'].includes(saved.phase);
        if(!Number.isInteger(saved.wordIndex)||saved.wordIndex<0||saved.wordIndex>wordCount||(!mayBeAtEnd&&saved.wordIndex===wordCount))return false;
        if(!Number.isInteger(saved.vowelIndex)||saved.vowelIndex<0||saved.vowelIndex>vowels.length)return false;
        levelIndex=saved.levelIndex;wordIndex=saved.wordIndex;vowelIndex=saved.vowelIndex;
        phase=saved.phase;letters=Array.isArray(saved.letters)?saved.letters:[];celebrationKey=saved.celebrationKey||null;savedAvailable=true;return true;
      } catch (_) { return false; }
    }
    function resumeProgress() {
      if(!restoreProgress())return renderHome();
      if(phase==='vowel')renderVowel();
      else if(phase==='sound')renderSound();
      else if(phase==='build')renderBuild(true);
      else if(phase==='story')renderStory();
      else if(phase==='celebrate'&&celebrationKey)renderCelebration(celebrationKey);
      else renderComplete();
    }
    function chooseVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
      // Respect the voice selected as the device's default instead of guessing which named voice sounds best.
      return voices.find(v => v.default && /^en-US$/i.test(v.lang)) || voices.find(v => v.default) || voices[0] || null;
    }
    englishVoice = chooseVoice();
    if ('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', () => { englishVoice = chooseVoice(); });
    function speak(text, slow = false) {
      if (!soundOn) return;
      const attempt = ++speechAttempt;
      clearTimeout(marinFallbackTimer);
      marinFallbackTimer = null;
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      audioPlayer.pause(); audioPlayer.currentTime=0;
      const clip = marinAudio[text];
      if (clip) {
        let settled = false;
        const fallback = () => {
          if (settled || attempt !== speechAttempt || !soundOn) return;
          settled = true;
          marinFallbackTimer = null;
          audioPlayer.pause();
          speakWithBrowserVoice(text,slow);
        };
        audioPlayer.src=clip; audioPlayer.playbackRate=slow?.82:1;
        marinFallbackTimer = setTimeout(fallback, MARIN_FALLBACK_TIMEOUT);
        audioPlayer.play().then(() => {
          if (attempt !== speechAttempt || settled) return;
          settled = true;
          clearTimeout(marinFallbackTimer);
          marinFallbackTimer = null;
        }).catch(fallback);
        return;
      }
      speakWithBrowserVoice(text,slow);
    }
    function speakWithBrowserVoice(text, slow = false) {
      if (!soundOn || !('speechSynthesis' in window)) return;
      const utterance = new SpeechSynthesisUtterance(text);
      if (englishVoice) utterance.voice = englishVoice;
      utterance.lang = 'en-US';
      utterance.rate = slow ? .8 : .96;
      utterance.pitch = 1;
      utterance.volume = 1;
      speechSynthesis.speak(utterance);
    }
    soundToggle.addEventListener('click', () => {
      soundOn = !soundOn; soundToggle.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
      if (!soundOn) {
        speechAttempt++;
        clearTimeout(marinFallbackTimer); marinFallbackTimer=null;
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        audioPlayer.pause(); audioPlayer.currentTime=0;
      }
    });
    document.querySelector('#hearDirections').addEventListener('click', () => speak(currentDirections));
    function setDirections(text, autoRead = true) {
      currentDirections = text;
      if (autoRead) setTimeout(() => speak(currentDirections), 450);
    }
    function renderHome() {
      phase = 'home';
      setDirections('Welcome to Word Garden! Ask a grown-up to press Let’s play to start your reading adventure.', false);
      main.innerHTML = `<section class="screen panel"><div class="eyebrow">A tiny adventure in reading</div><div class="garden-art" aria-hidden="true">🌼 🐝 🌷</div><h1>Welcome to<br><span>Word Garden!</span></h1><p class="intro">Warm up your vowel sounds, listen for sounds in words, then build and read short words, words with blends, and words with letter teams.</p>${savedAvailable?'<button class="secondary" id="continue" style="margin:0 8px 12px">Continue adventure ↗</button>':''}<button class="primary" id="start">${savedAvailable?'Start over':'Let’s play!'} <span aria-hidden="true">→</span></button><p class="tiny-note">No rush. Listen again, sound it out, and celebrate every try 💛</p></section>`;
      if(savedAvailable)document.querySelector('#continue').onclick=resumeProgress;
      document.querySelector('#start').addEventListener('click', () => { try{localStorage.removeItem(SAVE_KEY);}catch(_){} savedAvailable=false; levelIndex=0; wordIndex=0; vowelIndex=0; letters=[]; renderVowel(); });
    }
    function progress(label, count, current) { return `<div class="game-top"><button class="back" id="home" aria-label="Go to home">←</button><div class="progress-wrap"><div class="progress-label"><span>${label}</span><span>${current} of ${count}</span></div><div class="track"><div class="fill" style="width:${Math.max(5,(current-1)/count*100)}%"></div></div></div></div>`; }
    function hookHome() { document.querySelector('#home').onclick = renderHome; }
    function renderVowel() {
      phase='vowel'; locked=false; saveProgress();
      const v=vowels[vowelIndex];
      setDirections(`Vowel warm-up. I will say a vowel sound and a word. Tap the letter that makes that sound. Press Hear the sound to hear it again. ${v.say}`);
      const options=[...new Set([v.letter,...vowels.map(x=>x.letter)])].sort(()=>Math.random()-.5);
      main.innerHTML=`<section class="screen">${progress('Vowel warm-up',vowels.length,vowelIndex+1)}<div class="panel"><div class="step-label">🔤 Warm up · Vowel names &amp; sounds</div><h2 class="game-title">Which letter says…?</h2><p class="game-copy">${v.cue}</p><button class="listen" id="listen">🔊 &nbsp;Hear the sound</button><div class="choices">${options.map(ch=>`<button class="choice vowel-choice" data-letter="${ch}" aria-label="${ch.toUpperCase()}"><span class="picture">${ch.toUpperCase()}${ch}</span><span class="name">${ch=== 'y'?'sometimes a vowel':'letter '+ch.toUpperCase()}</span></button>`).join('')}</div><div class="feedback" id="feedback">Tap a letter. You can listen again any time!</div></div></section>`;
      hookHome();
      document.querySelector('#listen').onclick=()=>speak(v.say);
      document.querySelectorAll('.vowel-choice').forEach(btn=>btn.onclick=()=>{
        if(locked)return;
        if(btn.dataset.letter===v.letter){locked=true;btn.classList.add('correct');document.querySelector('#feedback').textContent=`That’s ${v.letter.toUpperCase()}! ${v.say} 🌟`;speak(`${v.letter.toUpperCase()}. ${v.say}`);setTimeout(()=>{vowelIndex++;vowelIndex<vowels.length?renderVowel():renderCelebration('vowels');},950);}
        else{btn.classList.add('wrong');document.querySelector('#feedback').textContent='Nice try! Listen again and choose the letter you hear 💛';speak('Nice try. Let’s hear it again.');setTimeout(()=>btn.classList.remove('wrong'),500);}
      });
    }
    function renderSound() {
      phase='sound';locked=false;letters=[];saveProgress();
      const w=item(), sounds=w.phonemes;
      const position=wordIndex%3, names=['beginning','middle','ending'];
      const soundIndex=position===0?0:position===1?Math.floor((sounds.length-1)/2):sounds.length-1;
      const target=sounds[soundIndex];
      setDirections(`Sound detective. Listen to the word ${w.word}. Beginning means first. Middle means inside. Ending means last. Tap the sound you hear in the ${names[position]}. Press Hear the word to listen again.`);
      const distractors=['m','s','t','p','n','b','f','l','r','d','g','k','sh','ch'].filter(x=>!sounds.includes(x));
      const choices=[target,...distractors.sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
      main.innerHTML=`<section class="screen">${progress(level().name,level().words.length,wordIndex+1)}<div class="panel"><div class="step-label">👂 Sound detective · ${level().name}</div><h2 class="game-title">Listen for the ${names[position]} sound</h2><p class="game-copy">What sound do you hear at the ${names[position]} of this word?</p><div class="word-picture" aria-hidden="true">${w.emoji}</div><button class="listen" id="listen">🔊 &nbsp;Hear the word</button><div class="choices">${choices.map(c=>`<button class="choice sound-choice" data-sound="${c}" aria-label="Sound ${c}"><span class="picture" style="font-size:2.6rem">/${c}/</span><span class="name">sound</span></button>`).join('')}</div><div class="feedback" id="feedback">Say the word slowly and listen for that part.</div></div></section>`;
      hookHome();document.querySelector('#listen').onclick=()=>speak(w.word,true);
      document.querySelectorAll('.sound-choice').forEach(btn=>btn.onclick=()=>{
        if(locked)return;
        if(btn.dataset.sound===target){locked=true;btn.classList.add('correct');letters=[];phase='build';saveProgress();document.querySelector('#feedback').textContent=`You heard /${target}/ in the ${names[position]}! Now build the word!`;speak(`Yes! ${w.word}. You heard ${target} in the ${names[position]}. Now let’s build it!`);setTimeout(renderBuild,850);}
        else{btn.classList.add('wrong');document.querySelector('#feedback').textContent='Good listening try! Hear the word slowly once more 💛';speak('Good try. Listen to the word again.');setTimeout(()=>btn.classList.remove('wrong'),500);}
      });
    }
    function renderBuild(resume = false) {
      phase='build';if(!resume)letters=[];saveProgress();
      const w=item();
      setDirections(`Build the word. Listen to ${w.word}, say each sound, then tap the sound tiles in order from left to right. Some sounds, like sh, use two letters together. Press Hear the word slowly if you need help.`);
      const mixed=w.phonemes.map((letter,index)=>({letter,index}));
      for(let i=mixed.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[mixed[i],mixed[j]]=[mixed[j],mixed[i]];}
      main.innerHTML=`<section class="screen">${progress(level().name,level().words.length,wordIndex+1)}<div class="panel"><div class="step-label">🧩 Sound it out · ${level().name}</div><h2 class="game-title">Build the word</h2><p class="game-copy">Tap each sound tile in order. Blend the sounds together!</p><div class="word-picture" aria-hidden="true">${w.emoji}</div><button class="listen" id="listen">🔊 &nbsp;Hear the word slowly</button><div class="slots">${w.phonemes.map((_,i)=>`<button class="slot" data-slot="${i}" aria-label="Empty sound spot ${i+1}"></button>`).join('')}</div><div class="tiles">${mixed.map(({letter,index})=>`<button class="tile" data-index="${index}" aria-label="Sound ${letter}">${letter}</button>`).join('')}</div><div class="feedback" id="feedback">Each tile is one sound. Tap a filled spot to change it.</div><div class="game-actions"><button class="secondary" id="clear">↶ Start over</button><button class="primary check" id="check" disabled>Check it! ✓</button></div></div></section>`;
      hookHome();document.querySelector('#listen').onclick=()=>speak(w.word,true);
      const update=()=>{document.querySelectorAll('.slot').forEach((slot,i)=>{slot.textContent=letters[i]?.letter||'';slot.classList.toggle('filled',!!letters[i]);});document.querySelectorAll('.tile').forEach(tile=>tile.disabled=letters.some(x=>x.index===Number(tile.dataset.index)));document.querySelector('#check').disabled=letters.length!==w.phonemes.length;saveProgress();};
      update();
      document.querySelectorAll('.tile').forEach(tile=>tile.onclick=()=>{if(letters.length<w.phonemes.length){letters.push({letter:tile.textContent,index:Number(tile.dataset.index)});update();}});
      document.querySelectorAll('.slot').forEach(slot=>slot.onclick=()=>{const i=Number(slot.dataset.slot);if(letters[i]){letters.splice(i,1);update();}});
      document.querySelector('#clear').onclick=()=>{letters=[];update();document.querySelector('#feedback').textContent='Take your time—you’ve got this!';};
      document.querySelector('#check').onclick=()=>{
        if(letters.map(x=>x.letter).join('')===w.phonemes.join('')){document.querySelector('#feedback').textContent=`${w.word}! You sounded it out! 🌟`;speak(`${w.word}! You sounded it out!`);setTimeout(()=>{wordIndex++;if(wordIndex<level().words.length)renderSound();else renderStory();},950);}
        else{document.querySelector('#feedback').textContent='Almost! Listen again and try moving a sound tile 💛';speak('Almost! Let’s listen and try again.');}
      };
    }
    function renderStory() {
      phase='story';saveProgress();
      const sentences=level().story.split('. ').filter(Boolean);
      setDirections('Reading break. Tap any word to hear it. Then read the sentence again with your grown-up. Or press Read it to me to hear the whole story.');
      main.innerHTML=`<section class="screen">${progress(`${level().name} · reread`,level().words.length,level().words.length)}<div class="panel"><div class="step-label">📖 Little reading break · ${level().name}</div><h2 class="game-title">Read it together!</h2><p class="game-copy">Tap a word to hear it. Then read the sentence again with your grown-up.</p><div class="story-lines">${sentences.map(line=>`<p style="font-size:clamp(1.35rem,4.4vw,2rem);font-weight:900;line-height:1.65;margin:10px 0">${line.split(' ').map(word=>`<button class="secondary story-word" style="font-size:inherit;padding:4px 8px;margin:2px">${word}</button>`).join(' ')}</p>`).join('')}</div><div class="game-actions"><button class="listen" id="readStory">🔊 &nbsp;Read it to me</button><button class="primary" id="nextLevel">${levelIndex<levels.length-1?'Next word garden →':'Finish adventure ✨'}</button></div><div class="feedback" id="feedback">You did it! Every reread helps words feel easier.</div></div></section>`;
      hookHome();document.querySelectorAll('.story-word').forEach(btn=>btn.onclick=()=>speak(btn.textContent.replace(/[.,!?]/g,'')));
      document.querySelector('#readStory').onclick=()=>speak(level().story);
      document.querySelector('#nextLevel').onclick=()=>renderCelebration(['cvc','blends','digraphs'][levelIndex]);
    }
    const celebrations = {
      vowels:{title:'Vowel garden blooming!',copy:'You practiced five vowel sounds. Your listening is growing stronger!',speech:'You did it, Madi! Your vowel garden is blooming. You practiced five vowel sounds!',art:'🌷 🌼 🌻',next:()=>renderSound()},
      cvc:{title:'Short-word garden grown!',copy:'You read short words with three sounds and a whole little story. That is wonderful reading!',speech:'Hooray, Madi! You read those short words and your little story!',art:'🌱 🌻 🐝',next:()=>{levelIndex=1;wordIndex=0;renderSound();}},
      blends:{title:'Sound-blending star!',copy:'You blended sounds together at the start of words to read them. Amazing work!',speech:'Amazing blending, Madi! You blended sounds to read those words!',art:'✨ 🐸 ✨',next:()=>{levelIndex=2;wordIndex=0;renderSound();}},
      digraphs:{title:'Letter-team detective!',copy:'You read words with sh, th, and ch, then tackled a whole story!',speech:'You did it, Madi! You read words with sh, th, and ch. Those letter teams make one sound!',art:'🚢 🏆 🐠',next:renderComplete}
    };
    function tossConfetti(count=34) {
      for(let i=0;i<count;i++)setTimeout(()=>{const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#ff7968','#ffc857','#58b987','#a98be8','#58c6d6'][i%5];c.style.animationDelay=Math.random()*.55+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3600);},i*24);
    }
    function renderCelebration(key) {
      const celebration=celebrations[key];
      if(!celebration)return renderHome();
      phase='celebrate';celebrationKey=key;saveProgress();
      main.innerHTML=`<section class="screen panel"><div class="eyebrow">Section complete!</div><div class="celebration-art" aria-hidden="true">${celebration.art}</div><div class="complete-stars">⭐ ⭐ ⭐</div><h1>${celebration.title}</h1><p class="celebration-copy">${celebration.copy}</p><button class="primary" id="continueCelebration">Keep going! →</button><p class="tiny-note">Every sound you try helps your reading grow 💛</p></section>`;
      tossConfetti(42);speak(celebration.speech);
      document.querySelector('#continueCelebration').onclick=()=>{celebrationKey=null;celebration.next();};
    }
    function renderComplete() {
      phase='complete';saveProgress();
      setDirections('You did it! You practiced vowel sounds, listened for sounds, built words, and read a story. You are a wonderful word explorer!', false);
      main.innerHTML=`<section class="screen panel"><div class="eyebrow">Garden helper extraordinaire</div><div class="garden-art" aria-hidden="true">🌻 🐝 🌈</div><div class="complete-stars">⭐ ⭐ ⭐</div><h1>You grew<br><span>so many words!</span></h1><p class="intro">You practiced vowel sounds, listened for sounds in words, and read short words, words with blends, and words with letter teams. Every sound-out and reread made you stronger!</p><button class="primary" id="again">Play again! ↻</button><p class="tiny-note">Brave readers keep trying—and you did! 💛</p></section>`;
      speak('Hooray! You grew so many words! You practiced vowel sounds and read words. You are a wonderful word explorer!');
      tossConfetti(52);
      document.querySelector('#again').onclick=()=>{levelIndex=0;wordIndex=0;vowelIndex=0;renderVowel();speak('Let’s play again!');};
    }
    if(restoreProgress())resumeProgress();else renderHome();
  </script>
</body>
</html>
